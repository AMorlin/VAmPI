# Linha "clássica" (4.x, pré-Hyades) do Dependency-Track, de propósito — não a 5.x.
# Motivo: verificado empiricamente que o apiserver 5.1.1 só espelha o NVD por padrão, e o NVD só
# casa vulnerabilidade por CPE, não por purl — o cdxgen gera SBOM Python só com purl, então nenhum
# achado aparece nunca nessa combinação, não importa quanto se espere. A linha 4.x expõe OSS Index
# e o mirror OSV por ecossistema (ambos casam por purl) configuráveis via API
# (POST /api/v1/configProperty), o que o workflow usa logo após o boot.
name: dependency-track

services:
  apiserver:
    image: dependencytrack/apiserver:4.14.4
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ALPINE_DATABASE_MODE: "external"
      ALPINE_DATABASE_URL: "jdbc:postgresql://postgres:5432/dtrack"
      ALPINE_DATABASE_DRIVER: "org.postgresql.Driver"
      ALPINE_DATABASE_USERNAME: "dtrack"
      ALPINE_DATABASE_PASSWORD: "dtrack"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - "apiserver-data:/data"
    restart: unless-stopped

  frontend:
    image: dependencytrack/frontend:4.14.4
    environment:
      API_BASE_URL: "http://localhost:8080"
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "dtrack"
      POSTGRES_USER: "dtrack"
      POSTGRES_PASSWORD: "dtrack"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - "postgres-data:/var/lib/postgresql/data"

volumes:
  apiserver-data: {}
  postgres-data: {}
